[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glass"
version = "0.1.14"
description = "AI that helps you speak any language in the real world."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Jin Kim <jin.kim@speakglass.com>" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "redis>=7.0.1",
    "SQLAlchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "PyJWT>=2.9",
    "greenlet>=3.0",
    "passlib[bcrypt]>=1.7",
    "email-validator>=2.0",
    "typing-extensions>=4.9",
    "aiosqlite>=0.20",
    "bcrypt>=4.0",
    "azure-storage-blob>=12.19",
    "stripe>=10.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "anyio>=4.3",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
