version: '3.9'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: glass
      POSTGRES_PASSWORD: glass
      POSTGRES_DB: glass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U glass']
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.31.0
    restart: unless-stopped
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --debug /data/debug.log
    ports:
      - '10000:10000'
    volumes:
      - azurite_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      GLASS_DATABASE_URL: postgresql+asyncpg://glass:glass@db:5432/glass
      GLASS_REDIS_URL: redis://redis:6379/0
      GLASS_ALLOW_ORIGIN: http://localhost:3000
      GLASS_LOG_LEVEL: INFO
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      azurite:
        condition: service_started
    ports:
      - '8000:8000'
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - backend_uploads:/app/var/uploads

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    env_file:
      - web/.env
    environment:
      # Client-side: Use localhost for browser access
      NEXT_PUBLIC_GLASS_API_URL: http://localhost:8000
      # Server-side: Use internal Docker network for SSR/API routes
      GLASS_API_URL_INTERNAL: http://api:8000
      NEXTAUTH_URL: http://localhost:3000
      # Must match the API's GLASS_AUTH_JWT_SECRET for JWT verification
      GLASS_AUTH_JWT_SECRET: ${GLASS_AUTH_JWT_SECRET}
    depends_on:
      - api
    ports:
      - '3000:3000'
    volumes:
      - ./web/app:/app/app
      - ./web/components:/app/components
      - ./web/contexts:/app/contexts
      - ./web/data:/app/data
      - ./web/hooks:/app/hooks
      - ./web/lib:/app/lib
      - ./web/types:/app/types
      - ./web/auth.ts:/app/auth.ts
      - ./web/proxy.ts:/app/proxy.ts
      - ./web/public:/app/public
      - ./web/locales:/app/locales

volumes:
  pgdata:
  backend_uploads:
  azurite_data:
