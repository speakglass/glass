# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !web/
            !tests/
            !.git/
            !.github/
            !node_modules/
            !**/__pycache__/
            !**/*.pyc
            !**/*.pyo
            !.pytest_cache/
            !.mypy_cache/
            !.ruff_cache/
            !*.egg-info/
            !.DS_Store

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D1982F066530470E84B4E4526A701019 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C6633FA1548343A283A24A85A3B2CA5B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_105E31D48C4F42A1A20B06EE74814FAE }}

      - name: 'Deploy to Staging Slot'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'glass'
          slot-name: 'staging'
          startup-command: 'bash scripts/start.sh'

      - name: '🔄 Run Database Migrations on Staging'
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "Running database migrations on staging slot..."
            az webapp ssh --name glass --slot staging --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --command "cd /home/site/wwwroot && alembic upgrade head" || echo "⚠️  Migration via SSH not available. Will run on container startup via start.sh"

      - name: '🔄 Swap Staging to Production'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deployment slot swap \
              -g ${{ secrets.AZURE_RESOURCE_GROUP }} \
              -n glass \
              --slot staging \
              --target-slot production
            echo "🎉 Deployment complete!"
