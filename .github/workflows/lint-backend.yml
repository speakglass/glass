name: Lint Backend

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/lint-backend.yml'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔍 Run lint script
        run: |
          chmod +x scripts/lint.sh
          ./scripts/lint.sh
